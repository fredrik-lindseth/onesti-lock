blueprint:
  name: "Onesti Lock: connectivity alerts"
  description: >
    Sends a notification when the lock becomes unavailable (disconnected)
    or comes back online. Useful for catching battery problems or weak
    Zigbee signal early.
  domain: automation
  input:
    lock_entity:
      name: Lock entity
      description: Pick your Onesti/Nimly lock
      selector:
        entity:
          filter:
            - domain: lock
              integration: zha
    unavailable_minutes:
      name: Minutes before alert
      description: How long the lock must be unavailable before a notification is sent
      default: 5
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: minutes

mode: single

triggers:
  - trigger: state
    entity_id: !input lock_entity
    to: "unavailable"
    for:
      minutes: !input unavailable_minutes
    id: offline
  - trigger: state
    entity_id: !input lock_entity
    from: "unavailable"
    to:
      - "locked"
      - "unlocked"
    id: online

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: offline
        sequence:
          - action: persistent_notification.create
            data:
              title: "Door lock offline"
              message: >
                {{ state_attr(trigger.entity_id, 'friendly_name') or 'The door lock' }}
                has been unavailable for {{ unavailable_minutes | default(5) }} minutes.
                Check the batteries and Zigbee coverage.
      - conditions:
          - condition: trigger
            id: online
        sequence:
          - action: persistent_notification.create
            data:
              title: "Door lock back online"
              message: >
                {{ state_attr(trigger.entity_id, 'friendly_name') or 'The door lock' }}
                is available again ({{ trigger.to_state.state }}).
