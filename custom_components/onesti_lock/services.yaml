          filter:
            integration: onesti_lock
    ieee:
      name: IEEE address
      description: Advanced, for scripts. The lock's Zigbee IEEE address, as ZHA shows it (for example 00:0d:6f:00:11:22:33:44). Only used when no lock is picked above.
      required: false
      selector:
        text:

set_name:
  name: Set slot name
  description: Set or change the name for a slot without changing the PIN
  fields:
    slot:
      name: Slot
      description: Slot to name (0-999). Names are stored in Home Assistant only, so master slots can be named too.
      required: true
      selector:
        number:
          min: 0
          max: 999
          mode: box
    name:
      name: Name
      description: Name for this user
      required: true
      selector:
        text:
    device_id:
      name: Lock
      description: The lock to use. Needed when more than one lock is set up. Wins over IEEE address if both are given.
      required: false
      selector:
        device:
          filter:
