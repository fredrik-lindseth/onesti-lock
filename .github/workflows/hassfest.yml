name: Hassfest (nightly)

# Same reasoning as validate.yml: hassfest runs in ci.yml for every pull
# request and every release candidate, and here every night, because Home
# Assistant can tighten its requirements for manifest.json and strings.json
# without us touching either file.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
