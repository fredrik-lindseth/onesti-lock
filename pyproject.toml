[project]
name = "onesti-lock"
# Not the release version. That lives in custom_components/onesti_lock/manifest.json,
# which HACS and the release workflow read. This project is never built or
# installed, so the number here stays a placeholder. It cannot be dynamic:
# uv would then build the project through setuptools to learn its version,
# and setuptools refuses this flat layout.
version = "0.0.0"
description = "Home Assistant integration for Onesti/Nimly smart locks"
# The floor is the runtime, not the dev toolchain: the integration runs in the
# user's Home Assistant Python, and HA 2025.6 (the hacs.json minimum) needs
# 3.13.2. It also bounds the whole of uv.lock, so raising it to the dev Python
# would drop the ha-minimum branch. Development and CI use the version in
# .python-version.
requires-python = ">=3.13.2"

[dependency-groups]
# tests/ with its homeassistant stubs, the environment `just test-unit` builds.
# No Home Assistant, voluptuous or zigpy, which is what scripts/ci_sim.py
# simulates by blocking them.
# pytest-cov is the release ha-current already pulls in through
# pytest-homeassistant-custom-component, so both suites write coverage data
# with the same coverage version and the files combine cleanly.
unit = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    # Only tests read YAML: the workflow files and quality_scale.yaml. Without
    # it those tests skip (pytest.importorskip), and the release flow would
    # have no check that release.yml still attests before it publishes.
    "pyyaml==6.0.3",
    # The BLE library (custom_components/onesti_lock/ble/crypto.py) does its
    # ECDH and AES through it. Home Assistant ships cryptography as a core
    # requirement, so it is not in manifest.json: a pin there could fight the
    # one HA sets. This is the release HA current pins (2026.9.3); HA 2025.6.0
    # pins 45.0.1, and crypto.py uses only API both have.
    "cryptography==48.0.1",
    { include-group = "ble" },
]
# bleak for the BLE library's bleak transport (ble/client/bleak_transport.py),
# which tests/ runs against a fake BleakClient. Not in manifest.json: Home
# Assistant brings its own bleak through the bluetooth integration, and HA
# 2025.6 runs 0.22.3, so the transport uses only API both releases have.
ble = [
    "bleak==3.0.2",
]
# Real Home Assistant for tests_ha/. tests/ stubs homeassistant in
# sys.modules and must never share an environment with these groups, so no
# group is installed by default and each target gets its own venv (see the
# justfile). Each pin is a pytest-homeassistant-custom-component release that
# itself pins homeassistant exactly.
#
# Minimum is the version hacs.json promises: 0.13.251 pins
# homeassistant==2025.6.0. tests/test_version_sync.py fails if they drift.
#
# zigpy is here for one reason: the Door Lock cluster the listener hangs on
# is a zigpy object, and which hook it offers changed with the version. Each
# group pins exactly the zigpy its own Home Assistant gets in production,
# through zha: HA 2025.6 -> zha 0.0.59 -> zigpy 0.80.1, which has no
# Cluster.on_event, and HA 2026.9 -> zha 2.2.2 -> zigpy 2.2.0, which has.
# tests_ha/test_zigpy_listener.py builds a real cluster from it and proves
# both registration paths. The zha library itself is still not installed, so
# tests_ha/conftest.py keeps standing in for it.
#
# The Bluetooth stack is pinned the same way, to exactly the requirements of
# that Home Assistant's own components/bluetooth/manifest.json, because
# custom_components/onesti_lock/bluetooth.py runs on whatever HA ships and
# the API of bleak (0.22 against 3.0) and habluetooth (3.x against 6.x)
# moved between the two. Left to the resolver, both groups got the newest
# release of each, which neither Home Assistant runs. Move these with the HA
# pin, read off that release's bluetooth manifest.
ha-minimum = [
    "pytest-homeassistant-custom-component==0.13.251",
    # HA 2025.6 pins aiodns==3.4.0 but not pycares, and pycares 5 removed the
    # API aiodns 3.x calls, so setup dies on an AttributeError without this.
    "pycares<5",
    "zigpy==0.80.1",
    "bleak==0.22.3",
    "bleak-retry-connector==3.9.0",
    "bluetooth-adapters==0.21.4",
    "bluetooth-auto-recovery==1.5.2",
    "bluetooth-data-tools==1.28.1",
    "dbus-fast==2.43.0",
    "habluetooth==3.49.0",
]
# Current is the newest stable release at the time of pinning. Pinned, never
# floating: 0.13.366 pins homeassistant==2026.9.3, which needs Python 3.14.
ha-current = [
    "pytest-homeassistant-custom-component==0.13.366",
    "zigpy==2.2.0",
    "bleak==3.0.2",
    "bleak-retry-connector==4.7.0",
    "bluetooth-adapters==2.4.0",
    "bluetooth-auto-recovery==1.6.4",
    "bluetooth-data-tools==1.29.24",
    "dbus-fast==5.0.22",
    "habluetooth==6.26.11",
]

[tool.uv]
# No group is a default: a bare `uv run` must not pull Home Assistant into an
# environment where tests/ expects its stubs.
default-groups = []
# The two HA groups pin different homeassistant versions and can never share
# an environment, and unit must never see Home Assistant at all. uv resolves
# each as a separate branch of uv.lock.
conflicts = [
    [{ group = "unit" }, { group = "ha-minimum" }, { group = "ha-current" }],
    # ble pins the bleak HA current ships, ha-minimum the older one HA 2025.6
    # ships, so the two never share an environment either.
    [{ group = "ble" }, { group = "ha-minimum" }],
]

[tool.uv.dependency-groups]
unit = { requires-python = ">=3.14.2" }
ha-minimum = { requires-python = ">=3.13.2,<3.14" }
ha-current = { requires-python = ">=3.14.2" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
# asyncio_mode is set where pytest-asyncio is installed, on the tests_ha
# command line in the justfile. The unit group has no pytest-asyncio, and an
# unknown option here warns on every run of tests/.

[tool.coverage.run]
# Relative paths let the unit and HA data files, written in different
# environments and CI jobs, combine into one report.
relative_files = true

[tool.ruff]
# Lowest runtime Python, so ruff never suggests syntax newer than HA 2025.6 runs.
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
# Same reason as ruff's target-version: check against the lowest runtime.
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
