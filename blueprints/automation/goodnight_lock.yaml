blueprint:
  name: "Onesti Lock: lock the door at night"
  description: >
    Locks the door automatically at a set time. Can be combined with
    turning off lights and other devices.
  domain: automation
  input:
    lock_entity:
      name: Lock entity
      description: Pick your Onesti/Nimly lock
      selector:
        entity:
          filter:
            - domain: lock
              integration: zha
    lock_time:
      name: Time
      description: When to lock the door
      default: "22:00:00"
      selector:
        time:
    additional_actions:
      name: Extra actions (optional)
      description: Actions to run along with locking (e.g. turning off lights)
      default: []
      selector:
        action:

mode: single

triggers:
  - trigger: time
    at: !input lock_time

actions:
  - action: lock.lock
    target:
      entity_id: !input lock_entity
  - choose: []
    default: !input additional_actions
