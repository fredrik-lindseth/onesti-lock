<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title desc">
  <title id="title">Onesti Lock</title>
  <desc id="desc">A fingertip pressed into metal. Two ridges run round a core that is not a whorl but a keyhole, cut clean through the plate. The lock tells who opened it.</desc>
  <!--
    Colour tokens. These rules are the only place a colour is written.
    The icon sits straight on Home Assistant's light and dark backgrounds, so
    every colour must reach 3:1 against white and against the dark theme background
    (WCAG 1.4.11, graphical objects). tests/test_brand_images.py measures that from here.
    The two are one step apart in lightness, which is all the band between 3:1 on
    white and 3:1 on the dark theme background allows. Depth comes from the bevel and the cuts.
  -->
  <style>
    .rim { fill: #8C6A3E; }
    .face { fill: #B3763A; }
  </style>
  <!--
    Ridges and keyhole are cut, not drawn: the mask lets the page through where it
    is black, so nothing inside the print has to hold contrast of its own. The words
    white and black below are mask coverage, not colours of the icon: they say how
    much of the plate survives, and the test that forbids colours outside the token
    block is right to ignore them.

    Two ridges, not three. Three were 11 units wide with 8 units of plate between
    them, which is a hair over one device pixel each at 24 px, and they closed into
    an even smear. Two at 19 units with 13 to 14 between them hold about two pixels
    per band, so the pattern still counts as two at 24 px. The plate grew from 200
    to 224 units wide and the ridges sit around a centre 10 units below the middle,
    which is where the width for the extra band came from; the 256 px drawing keeps
    the same proportions, only calmer.
  -->
  <mask id="cuts">
    <rect width="256" height="256" fill="white"/>
    <g fill="none" stroke="black" stroke-width="19" stroke-linecap="round">
      <path d="M156.3 163.0 A 46 52 0 1 0 99.7 163.0"/>
      <path d="M186.7 181.6 A 79 89 0 1 0 69.3 181.6"/>
    </g>
    <g fill="black">
      <circle cx="128" cy="116" r="23"/>
      <path d="M119 126 L 111 207 Q 110 218 121 218 H 135 Q 146 218 145 207 L 137 126 Z"/>
    </g>
  </mask>
  <g mask="url(#cuts)">
    <!-- The pad: a fingertip, wider above than below, touching both edges. -->
    <path class="rim" d="M128 0 C 206 0 240 54 240 120 C 240 194 193 256 128 256 C 63 256 16 194 16 120 C 16 54 50 0 128 0 Z"/>
    <path class="face" d="M128 13 C 199 13 227 61 227 121 C 227 189 185 244 128 244 C 71 244 29 189 29 121 C 29 61 57 13 128 13 Z"/>
  </g>
</svg>
