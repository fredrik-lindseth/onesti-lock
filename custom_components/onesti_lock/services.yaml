# Names and descriptions live in strings.json and translations/*.json, under
# the "services" section, so the action dialog follows the Home Assistant
# language. Only the shape of each action is described here.

set_pin:
  fields:
    slot:
      required: true
      selector:
        number:
          min: 1
          max: 999
          mode: box
    name:
      required: true
      selector:
        text:
    code:
      required: true
      selector:
        text:
          type: password
    device_id:
      required: false
      selector:
        device:
          filter:
            integration: onesti_lock
    ieee:
      required: false
      selector:
        text:

clear_pin:
  fields:
    slot:
      required: true
      selector:
        number:
          min: 1
          max: 999
          mode: box
    device_id:
      required: false
      selector:
        device:
          filter:
            integration: onesti_lock
    ieee:
      required: false
      selector:
        text:

set_name:
  fields:
    slot:
      required: true
      selector:
        number:
          min: 0
          max: 999
          mode: box
    name:
      required: true
      selector:
        text:
    device_id:
      required: false
      selector:
        device:
          filter:
            integration: onesti_lock
    ieee:
      required: false
      selector:
        text:

clear_slot:
  fields:
    slot:
      required: true
      selector:
        number:
          min: 1
          max: 999
          mode: box
    device_id:
      required: false
      selector:
        device:
          filter:
            integration: onesti_lock
    ieee:
      required: false
      selector:
        text:
