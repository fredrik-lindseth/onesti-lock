rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: exempt
    comment: |
      local_push with no polling. The lock's capabilities are read until it
      has answered once and are never read again on a schedule.
  brands:
    status: done
    comment: |
      The home-assistant/brands repository no longer takes custom
      integrations, so the icon ships in custom_components/onesti_lock/brand/.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: |
      The integration has no condition platform.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: |
      The integration has no trigger platform. The onesti_lock_activity event
      is documented as an event.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: done
    comment: |
      The flow only offers devices that ZHA knows with a Door Lock cluster.
      The lock sleeps, so a command cannot be used as a connection test.
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: |
      The entities follow OnestiCoordinator.available, which is false while no
      event listener is registered. A lock that is merely asleep stays
      available.
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: |
      OnestiCoordinator.set_available logs one INFO line when lock events stop
      and one when they are back, never the same one twice in a row.
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: |
      The integration has no login and stores no credentials.
  test-coverage:
    status: done
    comment: |
      The coverage job in CI combines tests/ and tests_ha and fails below 95 %.

  # Gold
  devices:
    status: done
    comment: |
      build_device_info in entity.py sets model, serial_number, the zigbee
      connection and a link to ZHA's own device for the lock.
  diagnostics: done
  discovery:
    status: done
    comment: |
      A loaded integration watches the device registry and starts an
      integration_discovery flow for every Onesti lock in ZHA no entry owns.
      The first lock cannot be discovered, since Home Assistant does not load
      a custom integration that has no entry.
  discovery-update-info:
    status: exempt
    comment: |
      The lock has no network address to update. Its IEEE address is its
      identity and never changes.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: |
      Each config entry has exactly one device. A new lock is a new entry.
  entity-category:
    status: done
    comment: |
      The lock's own numbers are diagnostic sensors. The slot and activity
      sensors are primary and carry no category.
  entity-device-class:
    status: exempt
    comment: |
      No sensor device class fits. The slot and activity sensors hold text,
      and the three capability sensors hold a slot count and two code
      lengths, which Home Assistant has no class for.
  entity-disabled-by-default:
    status: done
    comment: |
      The three capability sensors are disabled by default.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: done
    comment: |
      async_step_reconfigure points the entry at another Connect Module and
      keeps the device, its entities and the stored names.
  repair-issues: done
  stale-devices:
    status: exempt
    comment: |
      Each config entry has exactly one device, removed together with the
      entry.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: |
      The integration makes no HTTP requests.
  strict-typing:
    status: done
    comment: |
      mypy --strict covers the whole component, ble/ included: `just mypy`
      reports no issues in 36 source files, and the test-ha current job in CI
      runs it before the tests.
