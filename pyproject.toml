[project]
name = "onesti-lock"
version = "1.0.0"
description = "Home Assistant integration for Onesti/Nimly smart locks"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# CI has never enforced F401 on the integration, and it still has unused
# const imports. Remove this once they are cleaned up.
"custom_components/**" = ["F401"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
