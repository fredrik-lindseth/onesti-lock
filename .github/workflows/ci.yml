name: CI

on:
  pull_request:
    branches: [ main ]
  # release.yml calls this workflow for its own candidate SHA and waits for the
  # whole graph before it publishes. That is why there is no push trigger: on
  # main, release.yml starts CI, so there is exactly one run for that commit.
  # Two runs of the same thing are two answers to choose between.
  workflow_call:

permissions:
  contents: read

# HACS and hassfest validation live here, not in separate workflows. The
# release waits on this graph, and it cannot wait for what it does not see.
# The same two validators also run nightly from validate.yml and hassfest.yml,
# because both can turn red from changes outside this repository.
#
# Coverage: tests/ and tests_ha on current each upload their own report to
# Codecov under a flag (unit, ha), and Codecov merges them per commit. The
# quality scale's 95 % is enforced here, in the coverage job, which combines
# the raw data from both and fails below it. Codecov is for reading the
# numbers; it never decides whether CI is green.
#
# Actions are pinned to a major tag where one exists. setup-uv is the
# exception: Astral stopped publishing major and minor tags from v8.0.0, to
# guard against tag-rewriting attacks like the one on tj-actions, so `@v8` and
# up do not exist and `@v7` has been frozen since March 2026. It carries an
# exact version that is bumped by hand; do not rewrite it to a major tag.

jobs:
  release-gate:
    name: Release gate
    if: always()
    needs: [test, test-ha, coverage, hacs, hassfest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Skipped and cancelled count as failures: a job that did not run has
      # not shown that the candidate is fine.
      - name: Require success from every candidate job
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["JOB_RESULTS"])
          required = ("test", "test-ha", "coverage", "hacs", "hassfest")
          blocked = []
          for job in required:
              result = results.get(job, {}).get("result", "missing")
              print(f"{job}: {result}")
              if result != "success":
                  blocked.append(f"{job}: {result}")
          if blocked:
              print("::error::Release blocked: " + ", ".join(blocked))
              sys.exit(1)
          PY

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 3.14 is the dev and test Python (the last entry becomes the default).
      # 3.13 is the lowest Python the integration runs on (HA 2025.6), kept
      # only to prove the code still compiles there.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.13
            3.14

      # tests/ runs through uv in the unit group, so pytest here is ruff's only.
      - name: Install ruff
        run: |
          pip install ruff

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Validate manifest
        run: |
          jq empty custom_components/onesti_lock/manifest.json || exit 1
          echo "Manifest JSON is valid"

      - name: Check required files
        run: |
          REQUIRED_FILES=(
            "custom_components/onesti_lock/__init__.py"
            "custom_components/onesti_lock/manifest.json"
            "custom_components/onesti_lock/config_flow.py"
            "custom_components/onesti_lock/const.py"
            "custom_components/onesti_lock/strings.json"
            "README.md"
          )
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done
          echo "All required files present"

      - name: Check Python syntax on the lowest runtime Python
        run: |
          python3.13 -m py_compile custom_components/onesti_lock/*.py
          echo "Python syntax is valid on 3.13"

      - name: Lint with Ruff
        run: |
          ruff check custom_components/onesti_lock/ tests/ tests_ha/ scripts/
          echo "Ruff linting passed"

      - name: Run tests with coverage
        run: just coverage-unit -v

      # The number is useful, but it is not a test. `fail_ci_if_error: false`
      # covers errors Codecov reports; continue-on-error covers the rest, such
      # as the action not answering at all.
      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-unit.xml
          disable_search: true
          flags: unit
          fail_ci_if_error: false

      - name: Keep coverage data for the combined gate
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-unit
          path: .coverage.unit
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Check version consistency
        run: |
          VERSION=$(jq -r '.version' custom_components/onesti_lock/manifest.json)
          echo "Version: $VERSION"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $VERSION"
            exit 1
          fi
          echo "Version format is valid"

      # The release body is the short CHANGELOG note, built by the same script
      # the release flow imports. A missing section, a relative link pointing at
      # nothing, or a section with no bullet marked for the short note has to
      # fail here, inside the graph the release gate waits for. In the publish
      # step it would fail after the tag had been decided, and the flow would
      # stop with a version that CI had already called green.
      #
      # --require-date adds the release-day step that used to live in a
      # checklist: the section for the manifest version must carry its date and
      # not say "Unreleased". Only the section for that one version is looked
      # at, so the version being written above it is untouched. release_publish
      # runs the same function before it publishes.
      - name: Check the release note for the manifest version
        run: |
          VERSION=$(jq -r '.version' custom_components/onesti_lock/manifest.json)
          python3 scripts/release_notes.py "$VERSION" --short --require-date > /dev/null
          echo "CHANGELOG.md has a dated release note for $VERSION"

  test-ha:
    name: Real Home Assistant (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # minimum is the version hacs.json promises. If it fails, fix the
        # compatibility or raise the minimum on purpose, never silently.
        target: [minimum, current]
        # Coverage is measured on current only; see coverage-ha in the justfile.
        include:
          - target: minimum
            recipe: test-ha minimum
          - target: current
            recipe: coverage-ha
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Run real-HA tests
        run: just ${{ matrix.recipe }}

      - name: Upload coverage to Codecov
        if: matrix.target == 'current'
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-ha.xml
          disable_search: true
          flags: ha
          fail_ci_if_error: false

      - name: Keep coverage data for the combined gate
        if: matrix.target == 'current'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-ha
          path: .coverage.ha
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: Coverage (combined, at least 95 %)
    needs: [test, test-ha]
    runs-on: ubuntu-latest
    steps:
      # The sources are needed for the missing-lines report.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Fetch coverage data from both suites
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine and enforce 95 %
        run: just coverage-gate

  # Both validators run against someone else's `@main` and `@master` and talk
  # to GitHub's API. If they are slow or flaky they block the release rather
  # than let something through, which is the right way to fail. The timeout
  # keeps a hanging validator from holding the run for hours; re-run the job.
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
