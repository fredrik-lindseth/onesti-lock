homeassistant:
  name: Onesti Lock e2e
  latitude: 60.4
  longitude: 5.3
  elevation: 0
  time_zone: Europe/Oslo
  country: "NO"
  unit_system: metric
  currency: NOK

# frontend pulls http, api, websocket_api, config and onboarding, which is
# everything the driver uses. default_config is left out on purpose: it drags
# in bluetooth, zeroconf, ssdp and a recorder database that only make the
# start slower, and none of them say anything about this integration.
frontend:
api:
config:

# The blueprints under blueprints/automation/onesti_lock/ are validated by
# creating an automation from each one through the config API, which writes
# here.
automation: !include automations.yaml

# Two of the blueprints act on a lock entity, and there is no radio here to
# give them one. This template lock is the stand-in they are pointed at: a
# real lock entity with real lock and unlock actions, so lock.lock from a
# blueprint has somewhere to land and the result can be read back.
input_boolean:
  e2e_bolt:

template:
  - lock:
      name: E2E stand-in
      state: "{{ 'locked' if is_state('input_boolean.e2e_bolt', 'on') else 'unlocked' }}"
      lock:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.e2e_bolt
      unlock:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.e2e_bolt

# info, not warning: the container log is the evidence a failed CI run
# leaves behind, and warnings alone rarely say what happened.
logger:
  default: info
  logs:
    custom_components.onesti_lock: debug
