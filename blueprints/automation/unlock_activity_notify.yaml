blueprint:
  name: "Onesti Lock: notify on unlock"
  description: >
    Sends a notification when someone unlocks the door, showing who did it
    and how (PIN, fingerprint, RFID, Zigbee). Needs the Onesti Lock
    integration to identify the user.
  domain: automation
  input:
    activity_sensor:
      name: Activity sensor
      description: Pick the "Last activity" sensor from the Onesti Lock integration
      selector:
        entity:
          filter:
            - integration: onesti_lock
    notify_service:
      name: Notification service
      description: Pick a notification service (e.g. notify.mobile_app)
      default: persistent_notification.create
      selector:
        text:
    only_unlock:
      name: Unlock only
      description: Notify on unlocking only, not on locking
      default: true
      selector:
        boolean:

mode: single

triggers:
  - trigger: state
    entity_id: !input activity_sensor
    not_from:
      - "unknown"
      - "unavailable"

conditions:
  - condition: template
    value_template: >
      {% if only_unlock %}
        {{ state_attr(trigger.entity_id, 'action') == 'unlock' }}
      {% else %}
        true
      {% endif %}

actions:
  - variables:
      user_name: "{{ state_attr(trigger.entity_id, 'user_name') or 'Unknown' }}"
      source: "{{ state_attr(trigger.entity_id, 'source') or 'unknown' }}"
      action: "{{ state_attr(trigger.entity_id, 'action') or 'unknown' }}"
  - action: "{{ notify_service }}"
    data:
      title: "Door lock: {{ action }}"
      message: "{{ user_name }} {{ 'unlocked' if action == 'unlock' else 'locked' }} via {{ source }}"
